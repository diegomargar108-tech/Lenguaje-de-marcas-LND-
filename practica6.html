<!DOCTYPE html>
<html lang = "es">
    <head>
        <title>Eso era amor</title>
    </head>
    <body>
        <h1><i>"Eso era amor"</i></h1>
        <div class="poema">
            Le comenté: <br>
             —Me entusiasman tus ojos.<br>
            Y ella dijo:<br>
            —¿Te gustan solos o con rímel?<br>
            —Grandes, respondí sin dudar.<br>
            Y también sin dudar<br>
            me los dejó en un plato<br>
            y se fue a tientas.
        </div>
        <br>
        <cite>Ángel González</cite>
    </body>
</html>
